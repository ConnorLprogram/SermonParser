<!DOCTYPE html>
<html>
<head>
    <script src="SermonParser.js"></script>
    <link rel="stylesheet" href="SermonParser.css">
</head>
<body>

<h1>Pro Presenter Slide Parser</h1>
<p><label for="sParser">Input Text:</label></p>
<div id="inputArea">
    <textarea id="sParser" name="sParser" rows="10" cols="100"></textarea>
    <button type="button" id="submitButton">Submit</button>
</div>
<div id="optionsArea">
    <p><label for="sRow">Rows:</label></p>
    <input type="number" id="sRow" name="sRow" rows="1" cols="10" style="resize: none;" value="5" min="1" step="1"></input>
    <p><label for="sWidth">Character count:</label></p>
    <input type="number" id="sWidth" name="sWidth" rows="1" cols="10" style="resize: none;" value="55" min="1" step="1"></input>
</div>

<p>Output Text:</p>
<div id="outputArea">
    <textarea id="output" name="output" rows="10" cols="100"></textarea>
</div>


</body>
</html>
